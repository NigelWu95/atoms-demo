# Included inside one server block. No server-level CSP/XFO: runtime documents
# have their own sandbox policy and must keep the backend's exact response headers.
# https://nginx.org/en/docs/http/ngx_http_headers_module.html#add_header
server_tokens off;
client_max_body_size 512k;
client_body_timeout 15s;
access_log off;

location = /api { return 404; }
location ^~ /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header Forwarded "";
    # SSE must arrive immediately; preserve backend errors instead of SPA fallback.
    # https://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_buffering
    proxy_buffering off;
    proxy_cache off;
    proxy_intercept_errors off;
    proxy_read_timeout 90s;
    proxy_connect_timeout 5s;
}

location ~ /\. { return 404; }
location = /test-lab { return 404; }
location ^~ /test-lab/ { return 404; }
location ^~ /assets/ {
    include /etc/nginx/atoms-demo/nginx-static-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}
location = /index.html {
    include /etc/nginx/atoms-demo/nginx-static-headers.conf;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
}
location / {
    include /etc/nginx/atoms-demo/nginx-static-headers.conf;
    add_header Cache-Control "no-store" always;
    try_files $uri /index.html;
}
