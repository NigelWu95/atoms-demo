# Install as an nginx http-context site, after replacing the domain/certificate paths.
server {
    listen 80;
    server_name atoms.example.com;
    return 308 https://atoms.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name atoms.example.com;
    ssl_certificate /etc/letsencrypt/live/atoms.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atoms.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/atoms-demo/current/frontend;
    include /etc/nginx/atoms-demo/nginx-routes.conf;
}
