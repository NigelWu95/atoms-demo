spring:
  profiles:
    default: local
  session:
    timeout: 7d
    jdbc:
      initialize-schema: never
  application:
    name: atoms-demo
  config:
    import: optional:file:../.env.local[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/atoms_demo?currentSchema=atoms&connectTimeout=3&socketTimeout=5}
    username: ${DB_USER:atoms_app}
    password: ${APP_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 3000
      validation-timeout: 2000
  flyway:
    clean-disabled: true
    validate-migration-naming: true
  sql:
    init:
      mode: never
server:
  servlet:
    session:
      cookie:
        name: ATOMS_SESSION
        http-only: true
        secure: true
        same-site: lax
        max-age: 7d
  address: 127.0.0.1
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    whitelabel:
      enabled: false
