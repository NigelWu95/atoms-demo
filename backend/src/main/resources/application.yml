spring:
  profiles:
    default: local
  session:
    timeout: 7d
    jdbc:
      initialize-schema: never
  application:
    name: atoms-demo
  config:
    import: ${ATOMS_CONFIG_IMPORT:optional:file:../.env.local[.properties]}
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/atoms_demo?currentSchema=atoms&connectTimeout=3&socketTimeout=5}
    username: ${DB_USER:atoms_app}
    password: ${APP_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 3000
      validation-timeout: 2000
  flyway:
    clean-disabled: true
    validate-migration-naming: true
  sql:
    init:
      mode: never
atoms:
  project-workbench:
    enabled: ${PROJECT_WORKBENCH_ENABLED:false}
    default-mode: ${PROJECT_WORKBENCH_DEFAULT_MODE:false}
    owner-access-enabled: ${PROJECT_WORKBENCH_OWNER_ACCESS:false}
  project-delivery:
    enabled: ${PROJECT_DELIVERY_ENABLED:false}
    origin: ${PROJECT_DELIVERY_ORIGIN:}
  project-execution:
    enabled: ${PROJECT_EXECUTION_ENABLED:false}
    root: ${PROJECT_EXECUTION_ROOT:}
    node: ${PROJECT_EXECUTION_NODE:}
    npm: ${PROJECT_EXECUTION_NPM:}
    java: ${PROJECT_EXECUTION_JAVA:}
    maven: ${PROJECT_EXECUTION_MAVEN:}
    policy: ${PROJECT_EXECUTION_POLICY:}
    maintainer-ids: ${PROJECT_EXECUTION_MAINTAINER_IDS:}
    test-databases: ${PROJECT_EXECUTION_TEST_DATABASES:}
    runtime-databases: ${PROJECT_EXECUTION_RUNTIME_DATABASES:}
    database-pool: ${PROJECT_EXECUTION_DATABASE_POOL:}
    max-concurrent-builds: ${PROJECT_EXECUTION_MAX_CONCURRENT_BUILDS:1}
    queue-capacity: ${PROJECT_EXECUTION_QUEUE_CAPACITY:8}
    max-running-projects: ${PROJECT_EXECUTION_MAX_RUNNING_PROJECTS:4}
    task-timeout-seconds: ${PROJECT_EXECUTION_TASK_TIMEOUT_SECONDS:1800}
    queue-timeout-seconds: ${PROJECT_EXECUTION_QUEUE_TIMEOUT_SECONDS:300}
    start-timeout-seconds: ${PROJECT_EXECUTION_START_TIMEOUT_SECONDS:120}
  agent:
    enabled: ${PROJECT_AGENT_ENABLED:false}
    live-enabled: ${PROJECT_AGENT_LIVE_ENABLED:false}
    cli: ${PROJECT_AGENT_CLI:}
    state-root: ${PROJECT_AGENT_STATE_ROOT:}
    maintainer-ids: ${PROJECT_AGENT_MAINTAINER_IDS:}
    max-live-runs: ${PROJECT_AGENT_MAX_LIVE_RUNS:0}
    max-output-tokens: ${PROJECT_AGENT_MAX_OUTPUT_TOKENS:128000}
    max-turns: ${PROJECT_AGENT_MAX_TURNS:64}
    task-timeout-seconds: ${PROJECT_AGENT_TASK_TIMEOUT_SECONDS:1800}
    queue-timeout-seconds: ${PROJECT_AGENT_QUEUE_TIMEOUT_SECONDS:300}
    max-concurrent-tasks: ${PROJECT_AGENT_MAX_CONCURRENT_TASKS:4}
  source:
    enabled: ${PROJECT_SOURCE_ENABLED:false}
    root: ${PROJECT_SOURCE_ROOT:}
    work-root: ${PROJECT_SOURCE_WORK_ROOT:}
    git: ${PROJECT_SOURCE_GIT:}
    python: ${PROJECT_SOURCE_PYTHON:}
  runtime:
    enabled: ${APP_RUNTIME_ENABLED:false}
    root: ${APP_RUNTIME_ROOT:}
    configs: ${APP_RUNTIME_CONFIGS:}
  build:
    enabled: ${WORKSPACE_BUILD_ENABLED:false}
    root: ${WORKSPACE_BUILD_ROOT:}
    node: ${WORKSPACE_BUILD_NODE:}
    java: ${WORKSPACE_BUILD_JAVA:}
    test-config: ${WORKSPACE_BUILD_TEST_CONFIG:}
server:
  servlet:
    session:
      cookie:
        name: ATOMS_SESSION
        http-only: true
        secure: true
        same-site: lax
        max-age: 7d
  address: 127.0.0.1
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    whitelabel:
      enabled: false
