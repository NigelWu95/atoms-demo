<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Atoms · 运行文档测试台</title>
<style>
:root{color-scheme:dark;font-family:system-ui;background:#141912;color:#f2f3ed}body{margin:0}main{max-width:64rem;padding:2rem;margin:auto}p{color:#b8c2ad;line-height:1.7}h1{font-size:2rem}label{display:block;margin:1rem 0 .5rem}select,button,a{font:inherit}select,button{padding:.75rem;background:#222b1c;color:#f2f3ed;border:1px solid #647358;border-radius:.5rem}button{background:#d9f5a3;color:#1d2714;cursor:pointer}button:disabled{opacity:.6;cursor:wait}:focus-visible{outline:3px solid #d9f5a3;outline-offset:4px}a{color:#d9f5a3}iframe{display:block;width:100%;height:24rem;border:1px solid #647358;background:#faf9f5;margin-top:1rem}#status{min-height:2rem}[hidden]{display:none}@media(max-width:40rem){main{padding:1rem}h1{font-size:1.5rem}button{margin-top:.75rem}}
</style><script src="/test-lab.js" defer></script></head>
<body><main>
<p>ATOMS DEMO / LOCAL TEST LAB</p>
<h1>运行文档测试台</h1>
<p>这里只装载固定的手工测试产物，不是 AI 生成。数据写入 atoms_demo_test 专用测试库；不会替换正式项目。计数只在当前页面内有效，刷新会归零。</p>
<label for="fixture">测试产物</label>
<select id="fixture"><option value="counter">交互计数器</option><option value="todo">持久化待办（工作台）</option><option value="todo-history">待办历史只读（工作台）</option><option value="todo-review">待办版本差异（工作台）</option><option value="closing-tags">闭合标签转义</option><option value="security">隔离与资源拦截</option><option value="history">历史版本</option></select>
<button id="create" type="button">装载测试产物</button>
<p id="status" role="status" aria-live="polite">准备建立独立测试访客会话。</p>
<p id="error" role="alert"></p>
<a id="direct" target="_blank" rel="noopener noreferrer" hidden>直接打开受限文档</a>
<a id="workbench" hidden>打开测试工作台</a>
<div id="preview"></div>
</main></body></html>
