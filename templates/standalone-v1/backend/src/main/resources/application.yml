spring:
  application:
    name: standalone-app
  datasource:
    # Connection credentials are supplied only by StartupConfig, before Spring starts.
    hikari:
      maximum-pool-size: 5
      connection-timeout: 3000
      validation-timeout: 2000
      data-source-properties:
        connectTimeout: 3
        socketTimeout: 15
        logServerErrorDetail: false
  flyway:
    schemas: standalone_app
    default-schema: standalone_app
    create-schemas: false
    clean-disabled: true
    validate-migration-naming: true
    placeholders:
      instanceId: ${standalone.instance-id}
  sql:
    init:
      mode: never
  session:
    timeout: 7d
    jdbc:
      initialize-schema: never
      table-name: standalone_app.spring_session
server:
  address: 127.0.0.1
  port: 8088
  servlet:
    session:
      cookie:
        # StartupConfig supplies the stable name and HTTPS/local HTTP policy.
        http-only: true
        secure: true
        same-site: lax
        max-age: 7d
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    whitelabel:
      enabled: false
logging:
  structured:
    format:
      console: logstash
  level:
    # These libraries may log connection strings or SQL before exceptions reach our guard.
    # DatabaseInstallation emits the sanitized result and correlation ID instead.
    com.zaxxer.hikari: 'OFF'
    org.flywaydb: 'OFF'
    # A JDBC session failure during error-response flush is caught by RequestBoundaryFilter.
    # MVC otherwise logs the raw nested database exception before that sanitized boundary.
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: 'OFF'
    # A broken connection can also fail rollback. TransactionTemplate logs the original SQL
    # exception before our boundary returns a correlated, sanitized 503. Keep only that event.
    # https://github.com/spring-projects/spring-framework/blob/v6.2.19/spring-tx/src/main/java/org/springframework/transaction/support/TransactionTemplate.java
    org.springframework.transaction.support.TransactionTemplate: 'OFF'
