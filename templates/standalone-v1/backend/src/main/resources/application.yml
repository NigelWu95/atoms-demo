spring:
  application:
    name: standalone-app
  datasource:
    # Connection credentials are supplied only by StartupConfig, before Spring starts.
    hikari:
      maximum-pool-size: 5
      connection-timeout: 3000
      validation-timeout: 2000
  flyway:
    schemas: standalone_app
    default-schema: standalone_app
    create-schemas: false
    clean-disabled: true
    validate-migration-naming: true
  sql:
    init:
      mode: never
  session:
    timeout: 7d
    jdbc:
      initialize-schema: never
      table-name: standalone_app.spring_session
server:
  address: 127.0.0.1
  port: 8088
  servlet:
    session:
      cookie:
        # StartupConfig supplies the stable name and HTTPS/local HTTP policy.
        http-only: true
        secure: true
        same-site: lax
        max-age: 7d
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    whitelabel:
      enabled: false
